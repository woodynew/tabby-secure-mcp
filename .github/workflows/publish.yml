name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable version tag; dispatch this workflow on that same tag'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Validate release source before installing or executing package code
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release-check.mjs
      - name: Check npm OIDC support
        run: |
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)' "$(npm --version)"
      - run: npm ci --registry=https://registry.npmjs.org --no-audit
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run pack:check
      - name: Review publication manifest
        run: npm publish --workspace=packages/tabby-plugin --dry-run --access=public --registry=https://registry.npmjs.org
      - name: Publish only the plugin using npm trusted publishing
        run: npm publish --workspace=packages/tabby-plugin --access=public --provenance --registry=https://registry.npmjs.org
